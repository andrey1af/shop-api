name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run linters
        run: make lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api-service/go.mod
          cache: false

      - name: Run tests
        run: make test

  e2e:
    name: supplier e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_DB: shop_e2e
      POSTGRES_USER: shop_e2e
      POSTGRES_PASSWORD: shop_e2e
      API_PORT: "8080"
      E2E_BASE_URL: http://127.0.0.1:8080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api-service/go.mod
          cache: false

      - name: Start application stack
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Run supplier E2E tests
        run: make test-api-service-e2e

      - name: Print application logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: shop_ci
      POSTGRES_USER: shop_ci
      POSTGRES_PASSWORD: shop_ci
      API_PORT: "8080"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: make build
