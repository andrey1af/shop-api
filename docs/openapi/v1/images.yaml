paths:
  productImage:
    parameters:
      - $ref: "#/parameters/ProductId"
    post:
      tags: [Images]
      summary: Добавить изображение товара
      description: Загружает бинарные данные изображения и связывает их с товаром.
      operationId: createProductImage
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Изображение добавлено
          headers:
            Location:
              description: URL созданного изображения
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/schemas/ImageMetadata"
        "400":
          $ref: "#/responses/ValidationError"
        "404":
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: "#/schemas/Error"
              example:
                code: PRODUCT_NOT_FOUND
                message: product not found
        "409":
          description: У товара уже есть изображение
          content:
            application/json:
              schema:
                $ref: "#/schemas/Error"
              example:
                code: IMAGE_ALREADY_EXISTS
                message: product already has an image
        "500":
          $ref: "#/responses/InternalError"
    get:
      tags: [Images]
      summary: Скачать изображение товара
      operationId: downloadProductImage
      responses:
        "200":
          $ref: "#/responses/BinaryImage"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"

  image:
    parameters:
      - $ref: "#/parameters/ImageId"
    get:
      tags: [Images]
      summary: Скачать изображение по идентификатору
      operationId: downloadImageById
      responses:
        "200":
          $ref: "#/responses/BinaryImage"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
    put:
      tags: [Images]
      summary: Заменить изображение
      description: Полностью заменяет бинарные данные существующего изображения.
      operationId: replaceImage
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Изображение заменено
        "400":
          $ref: "#/responses/ValidationError"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
    delete:
      tags: [Images]
      summary: Удалить изображение
      operationId: deleteImage
      responses:
        "204":
          description: Изображение удалено или уже отсутствовало
        "500":
          $ref: "#/responses/InternalError"

schemas:
  ImageMetadata:
    type: object
    required: [id, product_id]
    properties:
      id:
        type: string
        format: uuid
        readOnly: true
      product_id:
        type: string
        format: uuid
        readOnly: true
    example:
      id: 1e07a39f-d7d1-49f0-bc33-80f53f6857d6
      product_id: 0866613a-d3d6-449d-99d4-d821c5755b0b

  Error:
    $ref: "./common.yaml#/schemas/Error"

parameters:
  ProductId:
    $ref: "./common.yaml#/parameters/ProductId"
  ImageId:
    name: imageId
    in: path
    required: true
    schema:
      type: string
      format: uuid

responses:
  ValidationError:
    $ref: "./common.yaml#/responses/ValidationError"
  NotFound:
    $ref: "./common.yaml#/responses/NotFound"
  InternalError:
    $ref: "./common.yaml#/responses/InternalError"
  BinaryImage:
    description: Бинарные данные изображения
    headers:
      Content-Disposition:
        description: Заголовок, инициирующий скачивание файла
        schema:
          type: string
        example: attachment; filename="image.bin"
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
