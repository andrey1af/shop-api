paths:
  collection:
    post:
      tags: [Products]
      summary: Добавить товар
      operationId: createProduct
      parameters:
        - $ref: "#/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/schemas/ProductCreate"
            example:
              name: Холодильник Frost 3000
              category: Холодильники
              price: 54990.00
              available_stock: 12
              last_update_date: "2026-08-26"
              supplier_id: 7116b493-97ab-472f-8ae2-b34ed382619c
              image_id: 1e07a39f-d7d1-49f0-bc33-80f53f6857d6
      responses:
        "201":
          description: Товар создан
          headers:
            Location:
              description: URL созданного товара
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/schemas/Product"
        "400":
          $ref: "#/responses/ValidationError"
        "404":
          description: Поставщик или изображение не найдены
          content:
            application/json:
              schema:
                $ref: "#/schemas/Error"
              example:
                code: SUPPLIER_NOT_FOUND
                message: supplier not found
        "409":
          $ref: "#/responses/IdempotencyConflict"
        "500":
          $ref: "#/responses/InternalError"
    get:
      tags: [Products]
      summary: Получить все доступные товары
      description: |
        Возвращает товары с `available_stock` больше нуля. Если таких товаров
        нет, возвращается пустой массив.
      operationId: getAvailableProducts
      responses:
        "200":
          description: Список доступных товаров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/schemas/Product"
              examples:
                result:
                  summary: Доступные товары
                  value:
                    - id: 0866613a-d3d6-449d-99d4-d821c5755b0b
                      name: Холодильник Frost 3000
                      category: Холодильники
                      price: 54990.00
                      available_stock: 12
                      last_update_date: "2026-08-26"
                      supplier_id: 7116b493-97ab-472f-8ae2-b34ed382619c
                      image_id: 1e07a39f-d7d1-49f0-bc33-80f53f6857d6
                empty:
                  summary: Доступные товары отсутствуют
                  value: []
        "500":
          $ref: "#/responses/InternalError"

  item:
    parameters:
      - $ref: "#/parameters/ProductId"
    get:
      tags: [Products]
      summary: Получить товар по идентификатору
      operationId: getProductById
      responses:
        "200":
          description: Данные товара
          content:
            application/json:
              schema:
                $ref: "#/schemas/Product"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
    delete:
      tags: [Products]
      summary: Удалить товар
      operationId: deleteProduct
      responses:
        "204":
          description: Товар удалён или уже отсутствовал
        "500":
          $ref: "#/responses/InternalError"

  stock:
    parameters:
      - $ref: "#/parameters/ProductId"
    patch:
      tags: [Products]
      summary: Уменьшить количество товара
      description: |
        Уменьшает `available_stock` на указанное положительное количество.
        Остаток товара не может стать отрицательным.
      operationId: decreaseProductStock
      parameters:
        - $ref: "#/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/schemas/StockDecrease"
            example:
              quantity: 2
      responses:
        "200":
          description: Остаток товара уменьшен
          content:
            application/json:
              schema:
                $ref: "#/schemas/Product"
        "400":
          $ref: "#/responses/ValidationError"
        "404":
          $ref: "#/responses/NotFound"
        "409":
          description: Недостаточно товара или конфликт ключа идемпотентности
          content:
            application/json:
              schema:
                $ref: "#/schemas/Error"
              examples:
                insufficientStock:
                  summary: Недостаточно товара
                  value:
                    code: INSUFFICIENT_STOCK
                    message: insufficient stock
                idempotencyConflict:
                  summary: Ключ использован с другим запросом
                  value:
                    code: IDEMPOTENCY_KEY_REUSED
                    message: idempotency key is already used with a different request
        "500":
          $ref: "#/responses/InternalError"

schemas:
  Product:
    type: object
    required:
      [id, name, category, price, available_stock, last_update_date, supplier_id]
    properties:
      id:
        type: string
        format: uuid
        readOnly: true
      name:
        type: string
        minLength: 1
        maxLength: 255
      category:
        type: string
        minLength: 1
        maxLength: 100
      price:
        type: number
        format: double
        minimum: 0
      available_stock:
        type: integer
        format: int64
        minimum: 0
      last_update_date:
        type: string
        format: date
      supplier_id:
        type: string
        format: uuid
      image_id:
        type: string
        format: uuid
        nullable: true
    example:
      id: 0866613a-d3d6-449d-99d4-d821c5755b0b
      name: Холодильник Frost 3000
      category: Холодильники
      price: 54990.00
      available_stock: 12
      last_update_date: "2026-08-26"
      supplier_id: 7116b493-97ab-472f-8ae2-b34ed382619c
      image_id: 1e07a39f-d7d1-49f0-bc33-80f53f6857d6

  ProductCreate:
    type: object
    additionalProperties: false
    required: [name, category, price, available_stock, supplier_id]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 255
      category:
        type: string
        minLength: 1
        maxLength: 100
      price:
        type: number
        format: double
        minimum: 0
      available_stock:
        type: integer
        format: int64
        minimum: 0
      last_update_date:
        type: string
        format: date
        description: Если не задана, сервер использует текущую дату
      supplier_id:
        type: string
        format: uuid
      image_id:
        type: string
        format: uuid
        nullable: true

  StockDecrease:
    type: object
    additionalProperties: false
    required: [quantity]
    properties:
      quantity:
        type: integer
        format: int64
        minimum: 1

  Error:
    $ref: "./common.yaml#/schemas/Error"

parameters:
  IdempotencyKey:
    $ref: "./common.yaml#/parameters/IdempotencyKey"
  ProductId:
    $ref: "./common.yaml#/parameters/ProductId"

responses:
  IdempotencyConflict:
    $ref: "./common.yaml#/responses/IdempotencyConflict"
  ValidationError:
    $ref: "./common.yaml#/responses/ValidationError"
  NotFound:
    $ref: "./common.yaml#/responses/NotFound"
  InternalError:
    $ref: "./common.yaml#/responses/InternalError"
