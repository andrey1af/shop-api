paths:
  collection:
    post:
      tags: [Suppliers]
      summary: Добавить поставщика
      operationId: createSupplier
      parameters:
        - $ref: "#/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/schemas/SupplierCreate"
            example:
              name: ООО БытТехника
              phone_number: "+7 495 123-45-67"
              address:
                country: Россия
                city: Москва
                street: Промышленная улица, 5
      responses:
        "201":
          description: Поставщик создан
          headers:
            Location:
              description: URL созданного поставщика
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/schemas/Supplier"
        "400":
          $ref: "#/responses/ValidationError"
        "409":
          $ref: "#/responses/IdempotencyConflict"
        "500":
          $ref: "#/responses/InternalError"
    get:
      tags: [Suppliers]
      summary: Получить всех поставщиков
      description: Если поставщики отсутствуют, возвращается пустой массив.
      operationId: getSuppliers
      responses:
        "200":
          description: Список поставщиков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/schemas/Supplier"
              examples:
                result:
                  value:
                    - id: 7116b493-97ab-472f-8ae2-b34ed382619c
                      name: ООО БытТехника
                      phone_number: "+7 495 123-45-67"
                      address:
                        id: dcab51ee-44cf-4342-bcda-4b542ef3044b
                        country: Россия
                        city: Москва
                        street: Промышленная улица, 5
                empty:
                  value: []
        "500":
          $ref: "#/responses/InternalError"

  item:
    parameters:
      - $ref: "#/parameters/SupplierId"
    get:
      tags: [Suppliers]
      summary: Получить поставщика по идентификатору
      operationId: getSupplierById
      responses:
        "200":
          description: Данные поставщика
          content:
            application/json:
              schema:
                $ref: "#/schemas/Supplier"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
    delete:
      tags: [Suppliers]
      summary: Удалить поставщика
      operationId: deleteSupplier
      responses:
        "204":
          description: Поставщик удалён или уже отсутствовал
        "409":
          description: Поставщик связан с товарами и не может быть удалён
          content:
            application/json:
              schema:
                $ref: "#/schemas/Error"
              example:
                code: SUPPLIER_IN_USE
                message: supplier is used by products
        "500":
          $ref: "#/responses/InternalError"

  address:
    parameters:
      - $ref: "#/parameters/SupplierId"
    get:
      tags: [Suppliers]
      summary: Получить адрес поставщика
      operationId: getSupplierAddress
      responses:
        "200":
          description: Адрес поставщика
          content:
            application/json:
              schema:
                $ref: "#/schemas/Address"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
    patch:
      tags: [Suppliers]
      summary: Изменить адрес поставщика
      operationId: updateSupplierAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/schemas/AddressCreate"
            example:
              country: Россия
              city: Санкт-Петербург
              street: Невский проспект, 25
      responses:
        "200":
          description: Адрес поставщика изменён
          content:
            application/json:
              schema:
                $ref: "#/schemas/Address"
        "400":
          $ref: "#/responses/ValidationError"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"

schemas:
  Supplier:
    type: object
    required: [id, name, phone_number, address]
    properties:
      id:
        type: string
        format: uuid
        readOnly: true
      name:
        type: string
        minLength: 1
        maxLength: 255
      phone_number:
        type: string
        minLength: 5
        maxLength: 30
      address:
        $ref: "#/schemas/Address"
    example:
      id: 7116b493-97ab-472f-8ae2-b34ed382619c
      name: ООО БытТехника
      phone_number: "+7 495 123-45-67"
      address:
        id: dcab51ee-44cf-4342-bcda-4b542ef3044b
        country: Россия
        city: Москва
        street: Промышленная улица, 5

  SupplierCreate:
    type: object
    additionalProperties: false
    required: [name, phone_number, address]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 255
      phone_number:
        type: string
        minLength: 5
        maxLength: 30
      address:
        $ref: "#/schemas/AddressCreate"

  Address:
    $ref: "./common.yaml#/schemas/Address"
  AddressCreate:
    $ref: "./common.yaml#/schemas/AddressCreate"

  Error:
    $ref: "./common.yaml#/schemas/Error"

parameters:
  IdempotencyKey:
    $ref: "./common.yaml#/parameters/IdempotencyKey"
  SupplierId:
    name: supplierId
    in: path
    required: true
    schema:
      type: string
      format: uuid

responses:
  IdempotencyConflict:
    $ref: "./common.yaml#/responses/IdempotencyConflict"
  ValidationError:
    $ref: "./common.yaml#/responses/ValidationError"
  NotFound:
    $ref: "./common.yaml#/responses/NotFound"
  InternalError:
    $ref: "./common.yaml#/responses/InternalError"
