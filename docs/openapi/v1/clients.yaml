paths:
  collection:
    post:
      tags: [Clients]
      summary: Добавить клиента
      operationId: createClient
      parameters:
        - $ref: "#/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/schemas/ClientCreate"
            example:
              client_name: Иван
              client_surname: Иванов
              birthday: "1990-05-17"
              gender: male
              registration_date: "2026-08-26"
              address:
                country: Россия
                city: Москва
                street: Тверская улица, 10
      responses:
        "201":
          description: Клиент создан
          headers:
            Location:
              description: URL созданного клиента
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/schemas/Client"
        "400":
          $ref: "#/responses/ValidationError"
        "409":
          $ref: "#/responses/IdempotencyConflict"
        "500":
          $ref: "#/responses/InternalError"
    get:
      tags: [Clients]
      summary: Получить клиентов
      description: |
        Для поиска по имени и фамилии передайте одновременно `client_name` и
        `client_surname`. Если фильтры не заданы, возвращаются все клиенты.
        `limit` и `offset` необязательны; без них список не ограничивается.
        При отсутствии данных возвращается пустой массив.
      operationId: getClients
      parameters:
        - $ref: "#/parameters/ClientName"
        - $ref: "#/parameters/ClientSurname"
        - $ref: "#/parameters/Limit"
        - $ref: "#/parameters/Offset"
      responses:
        "200":
          description: Список клиентов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/schemas/Client"
              examples:
                result:
                  summary: Найденные клиенты
                  value:
                    - id: b408cdff-bd44-4d9b-86b1-b140d3da00e7
                      client_name: Иван
                      client_surname: Иванов
                      birthday: "1990-05-17"
                      gender: male
                      registration_date: "2026-08-26"
                      address:
                        id: 53c7c1b0-e2cd-4cc8-9689-d56145c54a9b
                        country: Россия
                        city: Москва
                        street: Тверская улица, 10
                empty:
                  summary: Клиенты не найдены
                  value: []
        "400":
          $ref: "#/responses/InvalidParameters"
        "500":
          $ref: "#/responses/InternalError"

  item:
    parameters:
      - $ref: "#/parameters/ClientId"
    delete:
      tags: [Clients]
      summary: Удалить клиента
      operationId: deleteClient
      responses:
        "204":
          description: Клиент удалён или уже отсутствовал
        "500":
          $ref: "#/responses/InternalError"

  address:
    parameters:
      - $ref: "#/parameters/ClientId"
    get:
      tags: [Clients]
      summary: Получить адрес клиента
      operationId: getClientAddress
      responses:
        "200":
          description: Адрес клиента
          content:
            application/json:
              schema:
                $ref: "#/schemas/Address"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
    patch:
      tags: [Clients]
      summary: Изменить адрес клиента
      operationId: updateClientAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/schemas/AddressCreate"
            example:
              country: Россия
              city: Москва
              street: Тверская улица, 10
      responses:
        "200":
          description: Адрес клиента изменён
          content:
            application/json:
              schema:
                $ref: "#/schemas/Address"
        "400":
          $ref: "#/responses/ValidationError"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"

schemas:
  Client:
    type: object
    required:
      [id, client_name, client_surname, birthday, gender, registration_date, address]
    properties:
      id:
        type: string
        format: uuid
        readOnly: true
      client_name:
        type: string
        minLength: 1
        maxLength: 100
      client_surname:
        type: string
        minLength: 1
        maxLength: 100
      birthday:
        type: string
        format: date
      gender:
        type: string
        minLength: 1
        maxLength: 50
      registration_date:
        type: string
        format: date
      address:
        $ref: "#/schemas/Address"
    example:
      id: b408cdff-bd44-4d9b-86b1-b140d3da00e7
      client_name: Иван
      client_surname: Иванов
      birthday: "1990-05-17"
      gender: male
      registration_date: "2026-08-26"
      address:
        id: 53c7c1b0-e2cd-4cc8-9689-d56145c54a9b
        country: Россия
        city: Москва
        street: Тверская улица, 10

  ClientCreate:
    type: object
    additionalProperties: false
    required: [client_name, client_surname, birthday, gender, address]
    properties:
      client_name:
        type: string
        minLength: 1
        maxLength: 100
      client_surname:
        type: string
        minLength: 1
        maxLength: 100
      birthday:
        type: string
        format: date
      gender:
        type: string
        minLength: 1
        maxLength: 50
      registration_date:
        type: string
        format: date
        description: Если не задана, сервер использует текущую дату
      address:
        $ref: "#/schemas/AddressCreate"

  Address:
    $ref: "./common.yaml#/schemas/Address"
  AddressCreate:
    $ref: "./common.yaml#/schemas/AddressCreate"

  Error:
    $ref: "./common.yaml#/schemas/Error"

parameters:
  IdempotencyKey:
    $ref: "./common.yaml#/parameters/IdempotencyKey"
  ClientId:
    name: clientId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  ClientName:
    name: client_name
    in: query
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 100
  ClientSurname:
    name: client_surname
    in: query
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 100
  Limit:
    name: limit
    in: query
    required: false
    schema:
      type: integer
      format: int32
      minimum: 1
  Offset:
    name: offset
    in: query
    required: false
    schema:
      type: integer
      format: int32
      minimum: 0

responses:
  IdempotencyConflict:
    $ref: "./common.yaml#/responses/IdempotencyConflict"
  ValidationError:
    $ref: "./common.yaml#/responses/ValidationError"
  InvalidParameters:
    description: Параметры запроса не прошли валидацию
    content:
      application/json:
        schema:
          $ref: "#/schemas/Error"
        example:
          code: INVALID_QUERY_PARAMETERS
          message: invalid query parameters
  NotFound:
    $ref: "./common.yaml#/responses/NotFound"
  InternalError:
    $ref: "./common.yaml#/responses/InternalError"
