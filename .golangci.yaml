version: "2"

run:
  timeout: 5m

linters:
  # Используем стандартный набор линтеров, рекомендованный сообществом Go.
  default: standard

  # Дополнительные линтеры
  enable:
    - errorlint
    - gocritic
    - misspell

  # errorlint — проверяет корректность обработки ошибок.
  # Это улучшает надежность и упрощает отладку.

  # gocritic — мощный линтер с большим количеством проверок.
  # Выявляет распространённые антипаттерны, избыточные конструкции,
  # потенциальные проблемы производительности и читаемости.
  # Позволяет поддерживать высокий уровень качества кода.

  # misspell — проверяет орфографию в комментариях, строках и идентификаторах.
  # Помогает избежать опечаток, которые могут сбить с толку разработчиков.

formatters:
  enable:
    - gofmt
    - goimports

  # gofmt — стандартный форматтер Go, который обеспечивает единый стиль
  # оформления кода
  # Упрощает чтение и уменьшает количество споров о стиле.

  # goimports — расширение gofmt, которое также управляет импортами:
  # удаляет неиспользуемые, группирует стандартные и сторонние пакеты,
  # сортирует их. Поддерживает порядок в файлах.